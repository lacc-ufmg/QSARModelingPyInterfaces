[project]
name = "qsarmodeling"
version = "0.2.5"
description = "An open-source software to build and validate QSPR/QSAR models."
readme = "README.md"
authors = [
    { name = "Heliton Martins", email = "helitonmrf@gmail.com" },
    { name = "João Paulo Ataíde Martins", email = "joaopauloam@gmail.com" },
]
urls = { Homepage = "https://github.com/hellmrf/QSARModelingPyInterfaces" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"

dependencies = [
    "coloredlogs>=15.0.1",
    "loguru>=0.7.3",
    "matplotlib>=3.9.3",
    "pyside6>=6.8.1",
    "qsarmodelingpy==0.3.1",
]

[dependency-groups]
dev = ["mypy>=1.13.0", "ruff>=0.8.2", "typing-extensions>=4.12.2"]

[project.scripts]
#qsarmodeling = "qsarmodeling:main"

[project.gui-scripts]
qsarm = "qsarmodeling.main:main"


#################
## Build System
#################


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "*.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/qsarmodeling"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
